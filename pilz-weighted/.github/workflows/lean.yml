name: Weighted Pilz

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify release hashes
        run: python3 checks/verify_release.py
      - name: Build pinned Lean project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
          use-github-cache: false
      - name: Check exact public types and all transitive axioms
        run: lake env lean WeightedPilzFinalChecks.lean
      - name: Check compact regression suite
        run: lake env lean WeightedPilzChecks.lean
