name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: pilz
            checks: Checks.lean
          - project: pilz-density
            checks: DensityChecks.lean
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: ${{ matrix.project }}
          auto-config: false
          build: true
          use-mathlib-cache: true
          use-github-cache: false
      - name: Check theorem statements and axioms
        working-directory: ${{ matrix.project }}
        run: lake env lean ${{ matrix.checks }}
